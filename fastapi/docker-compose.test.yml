services:
  db:
    environment:
      POSTGRES_DB: linkshrtr_test

  app:
    command: ["pytest", "-v"]
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/linkshrtr_test
      TEST_DATABASE_URL: postgresql://postgres:password@db:5432/linkshrtr_test
      REDIS_URL: redis://redis:6379
      JWT_SECRET: docker-test-secret-at-least-32-characters
      BCRYPT_ROUNDS: "10"
      FRONTEND_URL: http://localhost:5173
    ports: []
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
